source = $HOME/.config/hypr/mocha.conf

$accent = $mauve
$accentAlpha = $mauveAlpha
$font = SauceCodePro Nerd Font

# GENERAL
general {
  disable_loading_bar = true
  hide_cursor = true
}

# BACKGROUND
background {
  monitor =
  path = $HOME/.config/yolk/wallpapers/lake_water_lily.png
  blur_passes = 2
  blur_size = 2
}

# TIME
label {
  monitor =
  text = $TIME
  color = rgba(211, 198, 170, 1.0)
  font_size = 90
  font_family = $font
  position = 0, -50
  halign = center
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = rgba(211, 198, 170, 1.0)
  font_size = 25
  font_family = $font
  position = 0, -200
  halign = center
  valign = top
}

# FINGERPRINT
{
  monitor = "";
  text = "$FPRINTPROMPT";
  color = "$text";
  font_size = 14;
  font_family = font;
  position = "0, -107";
  halign = "center";
  valign = "center";
}

# USER AVATAR
image {
  monitor =
  path = $HOME/.face
  size = 100
  border_color = $accent
  position = 0, 75
  halign = center
  valign = center
}

# INPUT FIELD
input-field {
  monitor =
  size = 270, 50
  outline_thickness = 3
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = rgba(167, 192, 128, 1.0)
  inner_color = rgba(45, 53, 59, 1.0)
  font_color = rgba(211, 198, 170, 1.0)
  fade_on_empty = false
  placeholder_text = <span foreground="##d3c6aa">󰌾  Logged in as <span foreground="##d699b6">$USER</span></span>
  hide_input = false
  check_color = rgba(167, 192, 128, 1.0)
  fail_color = rgba(230, 126, 128, 1.0)
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = rgba(219, 188, 127, 1.0)
  position = 0, -47
  halign = center
  valign = center
}

